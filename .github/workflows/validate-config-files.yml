name: Validate Config Files

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  validate:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate file naming convention
        run: |
          echo "## 📝 File Naming Validation" >> $GITHUB_STEP_SUMMARY
          
          INVALID_FILES=0
          VALID_FILES=0
          
          # Convención: {microservicio}-{ambiente}.{yml|yaml|properties}
          # Ambientes permitidos: dev, staging, prod, test, local
          VALID_PATTERN="^(ms-[a-z0-9-]+)-(dev|staging|prod|test|local)\.(yml|yaml|properties)$"
          
          for file in $(find . -maxdepth 1 -name "*.yml" -o -name "*.yaml" -o -name "*.properties" | grep -v "application"); do
            filename=$(basename "$file")
          
            if [[ "$filename" =~ $VALID_PATTERN ]]; then
              echo "✅ $filename" >> $GITHUB_STEP_SUMMARY
              VALID_FILES=$((VALID_FILES + 1))
            else
              echo "❌ Invalid naming: $filename" >> $GITHUB_STEP_SUMMARY
              echo "   Expected format: ms-{service}-{env}.{yml|properties}" >> $GITHUB_STEP_SUMMARY
              INVALID_FILES=$((INVALID_FILES + 1))
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: $VALID_FILES valid, $INVALID_FILES invalid" >> $GITHUB_STEP_SUMMARY
          
          if [ $INVALID_FILES -gt 0 ]; then
            echo "::error::Found $INVALID_FILES files with invalid naming"
            exit 1
          fi
      - name: Check all environments exist for each microservice
        run: |
          echo "## 🌍 Environment Coverage Check" >> $GITHUB_STEP_SUMMARY
          
          # Ambientes requeridos
          REQUIRED_ENVS=("dev" "prod")
          OPTIONAL_ENVS=("staging" "test")
          
          # Extraer microservicios únicos
          MICROSERVICES=$(ls ms-*.{yml,yaml,properties} 2>/dev/null | sed -E 's/ms-([a-z0-9-]+)-(dev|staging|prod|test|local)\..*/ms-\1/' | sort -u)
          
          MISSING_COUNT=0
          
          for service in $MICROSERVICES; do
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$service**:" >> $GITHUB_STEP_SUMMARY
          
            SERVICE_MISSING=0
          
            for env in "${REQUIRED_ENVS[@]}"; do
              if ls ${service}-${env}.* 2>/dev/null >/dev/null; then
                echo "  ✅ $env" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ❌ **$env (REQUIRED)**" >> $GITHUB_STEP_SUMMARY
                SERVICE_MISSING=$((SERVICE_MISSING + 1))
                MISSING_COUNT=$((MISSING_COUNT + 1))
              fi
            done
          
            for env in "${OPTIONAL_ENVS[@]}"; do
              if ls ${service}-${env}.* 2>/dev/null >/dev/null; then
                echo "  ✅ $env (optional)" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ⚠️  $env (optional - not found)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          done
          
          if [ $MISSING_COUNT -gt 0 ]; then
            echo "::error::Missing $MISSING_COUNT required environment files"
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All required environments present for all microservices" >> $GITHUB_STEP_SUMMARY
      - name: Validate YAML syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "*.yml"
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2
              document-start: disable
              truthy:
                allowed-values: ['true', 'false']
      - name: Validate Properties files
        run: |
          echo "## 📄 Properties Validation" >> $GITHUB_STEP_SUMMARY
          
          ERRORS=0
          
          for file in $(find . -maxdepth 1 -name "*.properties"); do
            echo "Validating $file..."
          
            # Verificar formato básico (key=value)
            if grep -vE '^#|^$|^[a-zA-Z0-9._-]+=.*$' "$file" > /dev/null; then
              echo "❌ Invalid format in $file" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ $(basename $file)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
      - name: Scan for unencrypted secrets
        run: |
          echo "## 🔐 Secret Encryption Check" >> $GITHUB_STEP_SUMMARY
          
          FOUND_PLAINTEXT=0
          
          # Palabras clave sensibles que DEBEN estar encriptadas
          SENSITIVE_PATTERNS=(
            "password"
            "secret"
            "apiKey"
            "api-key"
            "token"
            "privateKey"
            "private-key"
            "clientSecret"
            "client-secret"
            "credentials"
          )
          
          echo "Scanning for unencrypted sensitive values..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            # Buscar pattern que NO tenga {cipher}
            results=$(grep -rn "^[[:space:]]*${pattern}:" --include="ms-*.yml" --include="ms-*.yaml" --include="ms-*.properties" . | grep -v "{cipher}" || true)
          
            if [ -n "$results" ]; then
              echo "⚠️ Found unencrypted **${pattern}**:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$results" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              FOUND_PLAINTEXT=$((FOUND_PLAINTEXT + 1))
            fi
          done
          
          if [ $FOUND_PLAINTEXT -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Found $FOUND_PLAINTEXT potential unencrypted secrets. Consider using {cipher} prefix."
          else
            echo "✅ No plaintext secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Validate encrypted values format
        run: |
          echo "## 🔒 Encrypted Values Validation" >> $GITHUB_STEP_SUMMARY
          
          # Contar valores encriptados
          CIPHER_COUNT=$(grep -r "{cipher}" --include="ms-*.yml" --include="ms-*.yaml" --include="ms-*.properties" . 2>/dev/null | wc -l)
          
          echo "Found **$CIPHER_COUNT** encrypted values" >> $GITHUB_STEP_SUMMARY
          
          # Verificar formato válido de Base64 después de {cipher}
          INVALID=$(grep -rn "{cipher}" --include="ms-*.yml" --include="ms-*.yaml" --include="ms-*.properties" . | grep -v "{cipher}[A-Za-z0-9+/=]\+" || true)
          
          if [ -n "$INVALID" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Invalid cipher format found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$INVALID" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "✅ All encrypted values have valid Base64 format" >> $GITHUB_STEP_SUMMARY
      - name: Check for duplicate properties per microservice
        run: |
          echo "## 🔍 Duplicate Properties Check" >> $GITHUB_STEP_SUMMARY
          
          DUPLICATES_FOUND=0
          
          # Agrupar por microservicio
          MICROSERVICES=$(ls ms-*.{yml,properties} 2>/dev/null | sed -E 's/(ms-[a-z0-9-]+)-(dev|staging|prod|test|local)\..*/\1/' | sort -u)
          
          for service in $MICROSERVICES; do
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$service**:" >> $GITHUB_STEP_SUMMARY
          
            for file in ${service}-*.properties 2>/dev/null; do
              [ -f "$file" ] || continue
          
              # Extraer keys (ignorar comentarios)
              keys=$(grep -v '^\s*#' "$file" | grep '=' | cut -d'=' -f1 | sort)
              duplicates=$(echo "$keys" | uniq -d)
          
              if [ -n "$duplicates" ]; then
                echo "  ❌ Duplicates in $(basename $file):" >> $GITHUB_STEP_SUMMARY
                echo "     $duplicates" >> $GITHUB_STEP_SUMMARY
                DUPLICATES_FOUND=$((DUPLICATES_FOUND + 1))
              else
                echo "  ✅ $(basename $file)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          done
          
          if [ $DUPLICATES_FOUND -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ No duplicate properties found" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Compare prod vs dev configurations
        run: |
          echo "## ⚖️  Prod vs Dev Comparison" >> $GITHUB_STEP_SUMMARY
          
          MICROSERVICES=$(ls ms-*-dev.* 2>/dev/null | sed -E 's/(ms-[a-z0-9-]+)-dev\..*/\1/' | sort -u)
          
          for service in $MICROSERVICES; do
            DEV_FILE=$(ls ${service}-dev.* 2>/dev/null | head -n1)
            PROD_FILE=$(ls ${service}-prod.* 2>/dev/null | head -n1)
          
            if [ -f "$DEV_FILE" ] && [ -f "$PROD_FILE" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**$service**:" >> $GITHUB_STEP_SUMMARY
          
              # Extraer keys de ambos archivos
              DEV_KEYS=$(grep -v '^\s*#' "$DEV_FILE" | grep '=' | cut -d'=' -f1 | sort || echo "")
              PROD_KEYS=$(grep -v '^\s*#' "$PROD_FILE" | grep '=' | cut -d'=' -f1 | sort || echo "")
          
              # Keys solo en dev
              ONLY_DEV=$(comm -23 <(echo "$DEV_KEYS") <(echo "$PROD_KEYS"))
              # Keys solo en prod
              ONLY_PROD=$(comm -13 <(echo "$DEV_KEYS") <(echo "$PROD_KEYS"))
          
              if [ -n "$ONLY_DEV" ]; then
                echo "  ⚠️  Keys only in dev: $ONLY_DEV" >> $GITHUB_STEP_SUMMARY
              fi
          
              if [ -n "$ONLY_PROD" ]; then
                echo "  ⚠️  Keys only in prod: $ONLY_PROD" >> $GITHUB_STEP_SUMMARY
              fi
          
              if [ -z "$ONLY_DEV" ] && [ -z "$ONLY_PROD" ]; then
                echo "  ✅ Same keys in dev and prod" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
      - name: Scan for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - name: Generate summary report
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          
          TOTAL_FILES=$(ls ms-*.{yml,yaml,properties} 2>/dev/null | wc -l)
          MICROSERVICES=$(ls ms-*.* 2>/dev/null | sed -E 's/(ms-[a-z0-9-]+)-.*/\1/' | sort -u | wc -l)
          
          echo "- **Total config files**: $TOTAL_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- **Microservices**: $MICROSERVICES" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Contar archivos
            const files = execSync('ls ms-*.{yml,yaml,properties} 2>/dev/null || true', { encoding: 'utf-8' }).trim().split('\n').filter(Boolean);
            const microservices = new Set(files.map(f => f.split('-').slice(0, -1).join('-')));
            
            const comment = `## ✅ Configuration Validation Passed
            
            ### 📊 Statistics
            - **Total config files**: ${files.length}
            - **Microservices**: ${microservices.size}
            
            ### ✅ Validations Performed
            - File naming convention
            - Environment coverage (dev, prod required)
            - YAML/Properties syntax
            - Secret encryption check
            - Encrypted values format
            - Duplicate properties detection
            - Prod vs Dev comparison
            - Security scan (TruffleHog)
            
            All checks passed successfully! 🎉
            
            <details>
            <summary>View microservices</summary>
            
            ${Array.from(microservices).map(ms => `- ${ms}`).join('\n')}
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });