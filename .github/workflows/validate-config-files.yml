name: Validate Config Files

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  validate:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate file naming convention
        run: |
          echo "## 📝 File Naming Validation" >> $GITHUB_STEP_SUMMARY
          
          INVALID_FILES=0
          VALID_FILES=0
          
          # Convención: {microservicio}-{ambiente}.{yml|yaml|properties}
          # Ambientes permitidos: dev, staging, prod, test, local
          VALID_PATTERN="^(ms-[a-z0-9-]+)-(dev|staging|prod|test|local)\.(yml|yaml|properties)$"
          
          for file in $(find . -maxdepth 1 -name "*.yml" -o -name "*.yaml" -o -name "*.properties" | grep -v "application"); do
            filename=$(basename "$file")
          
            if [[ "$filename" =~ $VALID_PATTERN ]]; then
              echo "✅ $filename" >> $GITHUB_STEP_SUMMARY
              VALID_FILES=$((VALID_FILES + 1))
            else
              echo "❌ Invalid naming: $filename" >> $GITHUB_STEP_SUMMARY
              echo "   Expected format: ms-{service}-{env}.{yml|properties}" >> $GITHUB_STEP_SUMMARY
              INVALID_FILES=$((INVALID_FILES + 1))
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: $VALID_FILES valid, $INVALID_FILES invalid" >> $GITHUB_STEP_SUMMARY
          
          if [ $INVALID_FILES -gt 0 ]; then
            echo "::error::Found $INVALID_FILES files with invalid naming"
            exit 1
          fi
      - name: Check all environments exist for each microservice
        run: |
          echo "## 🌍 Environment Coverage Check" >> $GITHUB_STEP_SUMMARY
          
          # Ambientes requeridos
          REQUIRED_ENVS=("dev" "prod")
          OPTIONAL_ENVS=("staging" "test")
          
          # Extraer microservicios únicos
          MICROSERVICES=$(ls ms-*.{yml,yaml,properties} 2>/dev/null | sed -E 's/ms-([a-z0-9-]+)-(dev|staging|prod|test|local)\..*/ms-\1/' | sort -u)
          
          MISSING_COUNT=0
          
          for service in $MICROSERVICES; do
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$service**:" >> $GITHUB_STEP_SUMMARY
          
            SERVICE_MISSING=0
          
            for env in "${REQUIRED_ENVS[@]}"; do
              if ls ${service}-${env}.* 2>/dev/null >/dev/null; then
                echo "  ✅ $env" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ❌ **$env (REQUIRED)**" >> $GITHUB_STEP_SUMMARY
                SERVICE_MISSING=$((SERVICE_MISSING + 1))
                MISSING_COUNT=$((MISSING_COUNT + 1))
              fi
            done
          
            for env in "${OPTIONAL_ENVS[@]}"; do
              if ls ${service}-${env}.* 2>/dev/null >/dev/null; then
                echo "  ✅ $env (optional)" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ⚠️  $env (optional - not found)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          done
          
          if [ $MISSING_COUNT -gt 0 ]; then
            echo "::error::Missing $MISSING_COUNT required environment files"
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All required environments present for all microservices" >> $GITHUB_STEP_SUMMARY
      - name: Validate YAML syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "*.yml"
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2
              document-start: disable
              truthy:
                allowed-values: ['true', 'false']
      - name: Scan for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified