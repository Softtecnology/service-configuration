name: Validate Config Files

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  validate:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate file naming convention
        run: |
          echo "## 📝 File Naming Validation" >> $GITHUB_STEP_SUMMARY
          
          INVALID_FILES=0
          VALID_FILES=0
          
          VALID_PATTERN="^(ms-[a-z0-9-]+)-(dev|staging|prod|test|local)\.(yml|yaml|properties)$"
          
          for file in $(find . -maxdepth 1 -name "*.yml" -o -name "*.yaml" -o -name "*.properties" | grep -v "application"); do
            filename=$(basename "$file")
          
            if [[ "$filename" =~ $VALID_PATTERN ]]; then
              echo "✅ $filename" >> $GITHUB_STEP_SUMMARY
              VALID_FILES=$((VALID_FILES + 1))
            else
              echo "❌ Invalid naming: $filename" >> $GITHUB_STEP_SUMMARY
              echo "   Expected format: ms-{service}-{env}.{yml|properties}" >> $GITHUB_STEP_SUMMARY
              INVALID_FILES=$((INVALID_FILES + 1))
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: $VALID_FILES valid, $INVALID_FILES invalid" >> $GITHUB_STEP_SUMMARY
          
          if [ $INVALID_FILES -gt 0 ]; then
            echo "::error::Found $INVALID_FILES files with invalid naming"
            exit 1
          fi

      - name: Check all environments exist for each microservice
        run: |
          echo "## 🌍 Environment Coverage Check" >> $GITHUB_STEP_SUMMARY
          
          REQUIRED_ENVS=("dev" "prod")
          OPTIONAL_ENVS=("qa")

          MICROSERVICES=$(ls ms-*.{yml,yaml,properties} 2>/dev/null | sed -E 's/ms-([a-z0-9-]+)-(dev|staging|prod|test|local)\..*/ms-\1/' | sort -u)
          
          MISSING_COUNT=0
          
          for service in $MICROSERVICES; do
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$service**:" >> $GITHUB_STEP_SUMMARY
          
            SERVICE_MISSING=0
          
            for env in "${REQUIRED_ENVS[@]}"; do
              if ls ${service}-${env}.* 2>/dev/null >/dev/null; then
                echo "  ✅ $env" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ❌ **$env (REQUIRED)**" >> $GITHUB_STEP_SUMMARY
                SERVICE_MISSING=$((SERVICE_MISSING + 1))
                MISSING_COUNT=$((MISSING_COUNT + 1))
              fi
            done
          
            for env in "${OPTIONAL_ENVS[@]}"; do
              if ls ${service}-${env}.* 2>/dev/null >/dev/null; then
                echo "  ✅ $env (optional)" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ⚠️  $env (optional - not found)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          done
          
          if [ $MISSING_COUNT -gt 0 ]; then
            echo "::error::Missing $MISSING_COUNT required environment files"
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All required environments present for all microservices" >> $GITHUB_STEP_SUMMARY

      - name: Validate YAML syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "*.yml"
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2
              document-start: disable
              truthy:
                allowed-values: ['true', 'false']

      - name: Run Gitleaks
        id: gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          
          ./gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --report-path results.json \
            --report-format json \
            --verbose \
            --no-git || EXIT_CODE=$?
          
          if [ "${EXIT_CODE}" == "1" ]; then
            echo "::error::Gitleaks found secrets"
          fi
  
          if [ -f results.json ]; then
            ./gitleaks detect \
              --config .gitleaks.toml \
              --source . \
              --report-path results.sarif \
              --report-format sarif \
              --no-git || true
          fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process Gitleaks results
        if: always()
        run: |
          echo "## 🔐 Secret Detection (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          
          if [ -f results.sarif ]; then
            FINDINGS=$(jq '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
          
            if [ "$FINDINGS" -eq 0 ]; then
              echo "✅ **No secrets detected!**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All sensitive values appear to be properly encrypted." >> $GITHUB_STEP_SUMMARY
            else
              echo "🚨 **Found $FINDINGS potential secret(s)**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
          
              jq -r '.runs[0].results[] | "- **\(.ruleId)** in `\(.locations[0].physicalLocation.artifactLocation.uri)`:\(.locations[0].physicalLocation.region.startLine)"' results.sarif >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🔧 How to fix:" >> $GITHUB_STEP_SUMMARY
              echo '```bash' >> $GITHUB_STEP_SUMMARY
              echo 'curl -X POST http://config-server:8888/encrypt -d "your-secret"' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Then use:" >> $GITHUB_STEP_SUMMARY
              echo '```yaml' >> $GITHUB_STEP_SUMMARY
              echo 'password: "{cipher}AQA1234..."' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
          
              echo "::error::Found $FINDINGS secrets - please encrypt them"
              exit 1
            fi
          else
            echo "ℹ️  No Gitleaks results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const totalFiles = parseInt(execSync(
              'find . -maxdepth 1 \\( -name "ms-*.yml" -o -name "ms-*.yaml" -o -name "ms-*.properties" \\) | wc -l',
              { encoding: 'utf-8' }
            ).trim());
            
            const microservicesCount = parseInt(execSync(
              'find . -maxdepth 1 -name "ms-*.*" | sed -E "s/.*\\/(ms-[a-z0-9-]+)-.*/\\1/" | sort -u | wc -l',
              { encoding: 'utf-8' }
            ).trim());
            
            let secretsFound = 0;
            let secretsList = '';
            
            try {
              const sarif = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
              const findings = sarif.runs[0].results || [];
              secretsFound = findings.length;
            
              if (secretsFound > 0) {
                secretsList = '\n### 🚨 Secrets Detected\n\n' +
                  findings.map((f, i) => {
                    const loc = f.locations[0].physicalLocation;
                    return `${i + 1}. **${f.ruleId}** in \`${loc.artifactLocation.uri}\`:${loc.region.startLine}`;
                  }).join('\n');
              }
            } catch (e) {
              console.log('No Gitleaks results found');
            }
            
            const workflowStatus = '${{ job.status }}';
            const hasErrors = workflowStatus !== 'success' || secretsFound > 0;
            const statusEmoji = hasErrors ? '🚨' : '✅';
            const statusText = hasErrors ? 'Issues Found' : 'All Checks Passed';
            
            const comment = '## ' + statusEmoji + ' Configuration Validation - ' + statusText + '\n\n' +
              '### 📊 Statistics\n' +
              '- **Total config files**: ' + totalFiles + '\n' +
              '- **Microservices**: ' + microservicesCount + '\n' +
              '- **Secrets detected**: ' + secretsFound + '\n' +
              '- **Overall status**: ' + workflowStatus + '\n\n' +
              '### ✅ Validations Performed\n' +
              '1. **File naming convention** - `ms-{service}-{env}.{yml|yaml|properties}`\n' +
              '2. **Environment coverage** - Required: dev, prod | Optional: qa\n' +
              '3. **YAML syntax validation** - Linting rules compliance\n' +
              '4. **Secret detection** - Gitleaks scan for unencrypted secrets\n' +
              secretsList +
              (secretsFound > 0 ? '\n\n### 🔧 How to Fix Secrets\n\n' +
                '**1. Encrypt the value using Config Server:**\n' +
                '```bash\n' +
                'curl -X POST http://config-server:8888/encrypt -d "your-secret-value"\n' +
                '```\n\n' +
                '**2. Replace with encrypted value:**\n' +
                '```yaml\n' +
                'password: "{cipher}AQA1234abcd..."\n' +
                '```\n\n' +
                '**3. Or use environment variables:**\n' +
                '```yaml\n' +
                'password: ${DB_PASSWORD}\n' +
                '```\n\n' +
                '⚠️ **This PR cannot be merged until all secrets are encrypted.**'
                : '\n\n' + statusEmoji + ' All validations passed successfully! Safe to merge.');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });